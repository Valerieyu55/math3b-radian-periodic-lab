  <meta name="description" content="高中數學 3B 單元 01 弧度量數位智慧課本。結合物理拉直展開弧長、象限同界角螺旋、扇形公式、哥德式尖拱建築應用與 CASIO 工程計算機模擬器。">

            title: ['"辰宇落雁體 Thin"', '"辰宇落雁體"', '"ChenYuluoyan"', '"Nunito"', '"jf-openhuninn-1.1"', '"Noto Serif TC"', 'cursive', 'sans-serif'],

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ── Helper: KaTeX React Inline Component (Zero-Flicker Synchronous Rendering) ──
    const MathInline = ({ math, display = false, className = '' }) => {
      const html = useMemo(() => {
        if (!math) return '';
        if (typeof window !== 'undefined' && window.katex && window.katex.renderToString) {
          try {
            return window.katex.renderToString(String(math), {
              displayMode: display,
              throwOnError: false
            });
          } catch (e) {
            return '';
          }
        }
        return '';
      }, [math, display]);

      const containerRef = useRef(null);

      useEffect(() => {
        if (!html && containerRef.current && window.katex) {
          try {
            katex.render(String(math), containerRef.current, {
              displayMode: display,
              throwOnError: false
            });
          } catch (e) {
            containerRef.current.innerText = String(math);
          }
        }
      }, [math, display, html]);

      if (html) {
        return <span className={`inline-block align-middle ${className}`} dangerouslySetInnerHTML={{ __html: html }} />;
      }

      return <span ref={containerRef} className={`inline-block align-middle ${className}`}>{math}</span>;
    };

    // ── Global Score Storage ──
    const getStoredScores = () => {
      try {
        const s = localStorage.getItem('radian_lab_scores');
        return s ? JSON.parse(s) : { misconception: {}, misconceptionChoices: {}, practice: {}, practiceChoices: {} };
      } catch {
        return { misconception: {}, misconceptionChoices: {}, practice: {}, practiceChoices: {} };
      }
    };

    // ── Canvas Hook for High-DPI Rendering ──
    const useRetinaCanvas = (canvasRef, width, height) => {
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.scale(dpr, dpr);
      }, [width, height]);
    };

    // ── Canvas Helper: Pill Badge with Anti-Collision & Crisp Legibility ──
    const drawCanvasBadge = (ctx, text, x, y, options = {}) => {
      const {
        textColor = '#2B3848',
        bgColor = 'rgba(250, 247, 242, 0.94)',
        borderColor = '#DDD3C2',
        fontSize = 12,
        fontWeight = 'bold',
        fontFamily = '"Noto Sans TC", sans-serif',
        paddingX = 7,
        paddingY = 3.5,
        borderRadius = 6,
        align = 'center', // 'left', 'center', 'right'
        baseline = 'middle'
      } = options;

      ctx.save();
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
      const metrics = ctx.measureText(text);
      const textW = metrics.width;
      const boxW = textW + paddingX * 2;
      const boxH = fontSize + paddingY * 2 + 2;

      let boxX = x - boxW / 2;
      if (align === 'left') boxX = x;
      if (align === 'right') boxX = x - boxW;

      let boxY = y - boxH / 2;
      if (baseline === 'top') boxY = y;
      if (baseline === 'bottom') boxY = y - boxH;

      // Background Box Pill
      ctx.fillStyle = bgColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(boxX, boxY, boxW, boxH, borderRadius);
      } else {
        ctx.rect(boxX, boxY, boxW, boxH);
      }
      ctx.fill();
      ctx.stroke();

      // Text
      ctx.fillStyle = textColor;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, boxX + paddingX, boxY + boxH / 2 + 1);
      ctx.restore();
    };

    // ── TAB 1: 弧度定義與物理展開 (Unrolling Arc Lab) ──
    const DefinitionTab = () => {
      const [theta, setTheta] = useState(1.0); // in radians
      const [unrollPercent, setUnrollPercent] = useState(0); // 0 to 100
      const [activeModalConcept, setActiveModalConcept] = useState(null); // 'def', 'misconception', 'reason1', 'reason2', 'reason3'
      const canvasRef = useRef(null);
      const w = 680, h = 380;
      useRetinaCanvas(canvasRef, w, h);

      const r = 70; // Scaled radius so 2π r (6.28 r) fits on screen without overflowing canvas
      const deg = (theta * 180 / Math.PI).toFixed(1);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.clearRect(0, 0, w, h);

        const cx = 115, cy = 145;
        const p = unrollPercent / 100;

        // Background subtle grid
        ctx.strokeStyle = 'rgba(43, 56, 72, 0.04)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        // Draw Full dashed circle
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(122, 148, 168, 0.35)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Sector fill
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, 0, -theta, true);
        ctx.closePath();
        ctx.fillStyle = 'rgba(78, 114, 146, 0.14)';
        ctx.fill();

        // Radii OA and OB
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#2B3848';
        // Base radius OA
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r, cy); ctx.stroke();
        // Terminal radius OB
        const bx = cx + r * Math.cos(-theta);
        const by = cy + r * Math.sin(-theta);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke();

        // Points O, A, B
        ctx.fillStyle = '#2B3848';
        ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + r, cy, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fill();

        ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
        ctx.fillText('O (圓心)', cx - 25, cy + 22);
        ctx.fillText('A', cx + r + 8, cy + 4);
        ctx.fillText('B', bx + (bx >= cx ? 8 : -20), by + (by >= cy ? 15 : -8));

        // Center angle arc & label
        ctx.beginPath();
        ctx.arc(cx, cy, 28, 0, -theta, true);
        ctx.strokeStyle = '#A37547';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        const midA = -theta / 2;
        const labelR = theta < 0.4 ? 54 : 46;
        const lx = cx + labelR * Math.cos(midA);
        const ly = cy + labelR * Math.sin(midA);
        drawCanvasBadge(ctx, `θ = ${theta.toFixed(2)} rad`, lx, ly, {
          textColor: '#7D542B',
          bgColor: 'rgba(250, 246, 240, 0.95)',
          borderColor: '#ECDDCB',
          align: 'center',
          fontSize: 11
        });

        // Radius label
        ctx.fillStyle = '#4E7292';
        ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
        ctx.fillText(`半徑 r = 1`, cx + r / 2 - 18, cy - 8);

        // Reference Ruler Setup
        const rulerY = 275;
        const rulerStartX = cx + r;

        // Vertical Guide Line connecting Point A (185, 145) to Ruler 0r (185, 275)
        ctx.beginPath();
        ctx.moveTo(cx + r, cy);
        ctx.lineTo(rulerStartX, rulerY);
        ctx.strokeStyle = 'rgba(122, 148, 168, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Arc peeling & Unrolling animation
        const totalArc = r * theta;
        const unrolledLen = totalArc * p;
        const remainTheta = theta * (1 - p);

        // Remaining curved arc on circle
        if (remainTheta > 0.001) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, -remainTheta, true);
          ctx.strokeStyle = '#4E7292';
          ctx.lineWidth = 4.5;
          ctx.stroke();
        }

        // Ruler base track
        ctx.strokeStyle = '#CBD2DB';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(90, rulerY); ctx.lineTo(w - 20, rulerY); ctx.stroke();

        // Ruler tick marks: Integer r ticks below ruler line; Special constant ticks (π r, 2π r) above ruler line
        const integerTicks = [
          { val: 0, label: '0' },
          { val: r, label: '1 r (1 rad)' },
          { val: r * 2, label: '2 r (2 rad)' },
          { val: r * 3, label: '3 r (3 rad)' },
          { val: r * 4, label: '4 r' },
          { val: r * 5, label: '5 r' },
          { val: r * 6, label: '6 r' },
        ];

        integerTicks.forEach(t => {
          const tx = rulerStartX + t.val;
          if (tx <= w - 15) {
            ctx.beginPath(); ctx.moveTo(tx, rulerY); ctx.lineTo(tx, rulerY + 8);
            ctx.strokeStyle = '#758BA1';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#546B84';
            ctx.font = 'bold 10px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(t.label, tx, rulerY + 22);
          }
        });

        // Special Math Ticks (π r and 2π r) - Placed ABOVE the ruler line
        const piTicks = [
          { val: r * Math.PI, label: 'π r (180°)' },
          { val: r * Math.PI * 2, label: '2π r (360°)' }
        ];

        piTicks.forEach(t => {
          const tx = rulerStartX + t.val;
          if (tx <= w - 15) {
            ctx.beginPath(); ctx.moveTo(tx, rulerY); ctx.lineTo(tx, rulerY - 10);
            ctx.strokeStyle = '#A15650';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = '#A15650';
            ctx.font = 'bold 10px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(t.label, tx, rulerY - 16);
          }
        });

        ctx.textAlign = 'left';

        // Unrolled section on ruler
        if (unrolledLen > 0) {
          ctx.beginPath();
          ctx.moveTo(rulerStartX, rulerY);
          ctx.lineTo(rulerStartX + unrolledLen, rulerY);
          ctx.strokeStyle = '#2B3848';
          ctx.lineWidth = 5;
          ctx.stroke();

          // End pointer
          ctx.fillStyle = '#2B3848';
          ctx.beginPath();
          ctx.arc(rulerStartX + unrolledLen, rulerY, 6, 0, Math.PI * 2);
          ctx.fill();

          // Arc length badge
          const badgeX = Math.min(Math.max(rulerStartX + unrolledLen / 2, rulerStartX + 50), w - 85);
          drawCanvasBadge(ctx, `拉直弧長 s = ${(theta * p).toFixed(2)} r`, badgeX, rulerY + 48, {
            textColor: '#1E2834',
            bgColor: 'rgba(240, 245, 250, 0.96)',
            borderColor: '#CBD2DB',
            align: 'center',
            fontSize: 11
          });
        }

        // Connecting dynamic Peel Curve (from circle tip to ruler)
        if (p > 0.01 && p < 0.99) {
          const tipX = cx + r * Math.cos(-remainTheta);
          const tipY = cy + r * Math.sin(-remainTheta);
          const landX = rulerStartX + unrolledLen;
          const landY = rulerY;

          ctx.beginPath();
          ctx.moveTo(tipX, tipY);
          ctx.bezierCurveTo(tipX + 25, tipY + 35, landX - 25, landY - 25, landX, landY);
          ctx.strokeStyle = 'rgba(78, 114, 146, 0.5)';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.restore();
      }, [theta, unrollPercent]);

      return (
        <div className="space-y-6 animate-slide-up pb-10">
          <div className="textbook-card p-6 md:p-8 rounded-2xl">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <div className="text-[10px] font-black bg-nordic-light text-nordic border border-nordic-border px-3 py-1 rounded-full inline-block mb-2 uppercase tracking-widest shadow-xs">
                  MODULE 01 · 核心概念
                </div>
                <h2 className="text-3xl md:text-4xl font-bold font-chenyu tracking-wide text-slate-800 flex items-center gap-3">
                  <i className="fa-solid fa-circle-notch text-nordic"></i>
                  弧度量的幾何定義與物理展開
                </h2>
                <p className="text-slate-600 font-bold text-sm mt-1">
                  拖曳滑桿改變圓心角，或動手將圓弧「拉直」比對半徑刻度，直觀感受 1 弳的實數幾何意義。
                </p>
              </div>
              <div className="bg-gradient-to-br from-nordic-light to-[#E2EDF5] border border-nordic-border px-5 py-3 rounded-2xl text-center shadow-xs">
                <span className="text-[10px] font-black text-nordic uppercase tracking-widest block mb-1">RADIAN DEFINITION</span>
                <span className="text-xl font-black text-nordic-dark font-serif flex items-center justify-center">
                  <MathInline math="\theta = \frac{s}{r}" className="text-xl font-bold" />
                </span>
              </div>
            </div>

            {/* Canvas Stage Workbench */}
            <div className="canvas-stage-card p-3 md:p-4 mb-6 relative overflow-hidden flex flex-col items-center justify-center">
              <div className="w-full flex items-center justify-between px-2 pb-2 mb-2 border-b border-[#2B3848]/10 text-[10px] font-black text-slate-400 tracking-wider">
                <span className="flex items-center gap-1.5"><i className="fa-solid fa-drafting-compass text-nordic"></i> GEOMETRIC CANVAS · RADIAN UNROLLING ENGINE</span>
                <span className="bg-[#EAE3D5] text-[#2B3848] px-2 py-0.5 rounded font-mono">VECTOR HIGH-DPI</span>
              </div>
              <canvas ref={canvasRef} className="max-w-full h-auto rounded-xl" />
            </div>

            {/* Controls Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 control-box-card p-6 mb-6">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-black text-slate-700 flex items-center gap-2">
                    <i className="fa-solid fa-compass-drafting text-nordic"></i>
                    圓心角 <MathInline math="\theta" /> (弳度 / 角度)
                  </label>
                  <span className="text-nordic-dark font-black text-sm bg-nordic-light px-3 py-1 rounded-lg border border-nordic-border shadow-xs">
                    {theta >= Math.PI * 2 - 0.03 ? '2π rad (360.0°)' : `${theta.toFixed(2)} rad (${deg}°)`}
                  </span>
                </div>
                <input type="range" min="0.2" max={Math.PI * 2} step="0.01" value={theta}
                  onChange={e => {
                    const val = parseFloat(e.target.value);
                    setTheta(val >= Math.PI * 2 - 0.04 ? Math.PI * 2 : val);
                  }} className="w-full mb-3" />
                <div className="flex gap-1.5 flex-wrap">
                  {[
                    { node: <span>1 弳 (1 rad)</span>, val: 1.0 },
                    { node: <span className="inline-flex items-center gap-1"><MathInline math="\frac{\pi}{3}" /> (60°)</span>, val: Math.PI / 3 },
                    { node: <span className="inline-flex items-center gap-1"><MathInline math="\frac{\pi}{2}" /> (90°)</span>, val: Math.PI / 2 },
                    { node: <span className="inline-flex items-center gap-1"><MathInline math="\pi" /> (180°)</span>, val: Math.PI },
                    { node: <span className="inline-flex items-center gap-1"><MathInline math="2\pi" /> (360°)</span>, val: Math.PI * 2 },
                  ].map((p, idx) => (
                    <button key={idx} onClick={() => setTheta(p.val)}
                      className="flex-1 py-1.5 bg-[#FAF7F2] hover:bg-nordic-light hover:text-nordic-dark rounded-xl text-xs font-black text-slate-700 transition-all border border-[#DDD3C2] hover:border-nordic-border flex items-center justify-center min-h-[38px] shadow-xs">
                      {p.node}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-black text-slate-700 flex items-center gap-2">
                    <i className="fa-solid fa-ruler-horizontal text-sage"></i>
                    圓弧物理展開 (Unroll Arc to Line)
                  </label>
                  <span className="text-sage-dark font-black text-sm bg-sage-light px-3 py-1 rounded-lg border border-sage-border shadow-xs">
                    {unrollPercent}%
                  </span>
                </div>
                <input type="range" min="0" max="100" value={unrollPercent}
                  onChange={e => setUnrollPercent(parseInt(e.target.value))} className="w-full mb-3" />
                <div className="flex gap-2">
                  <button onClick={() => setUnrollPercent(0)} className="flex-1 py-1.5 bg-[#FAF7F2] hover:bg-[#EFE8DC] rounded-xl text-xs font-black text-slate-700 border border-[#DDD3C2] transition-all min-h-[38px] shadow-xs">重合在圓上 (0%)</button>
                  <button onClick={() => setUnrollPercent(100)} className="flex-1 py-1.5 bg-sage text-white hover:bg-sage-dark rounded-xl text-xs font-black shadow-sm transition-all min-h-[38px]">完全拉直 (100%)</button>
                </div>
              </div>
            </div>

            {/* Formula & Concept Callouts with Hover Zoom & Click Expand */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div 
                onClick={() => setActiveModalConcept('def')}
                className="group concept-box p-5 bg-gradient-to-br from-nordic-light to-[#E1ECF4] border border-nordic/40 rounded-2xl shadow-xs cursor-pointer transition-all duration-300 transform hover:scale-[1.03] hover:-translate-y-1 hover:shadow-xl hover:ring-2 hover:ring-nordic/50">
                <div className="flex justify-between items-center mb-2">
                  <h4 className="font-black text-nordic-dark text-sm flex items-center gap-2">
                    <i className="fa-solid fa-lightbulb text-nordic"></i>
                    什麼是 1 弳 (1 Radian)？
                  </h4>
                  <span className="text-[10px] font-black bg-white/90 text-nordic-dark px-2 py-0.5 rounded-full border border-nordic-border opacity-70 group-hover:opacity-100 transition-opacity">
                    點擊看放大詳解 🔍
                  </span>

                        className={`px-5 py-2.5 rounded-xl font-black text-xs md:text-sm flex items-center gap-2 transition-all ${
                          prevConcept 
                            ? 'bg-[#FAF7F2] hover:bg-[#EFE8DC] text-slate-700 border border-[#DDD3C2] shadow-xs cursor-pointer' 
                            : 'bg-slate-100 text-slate-300 border border-slate-200 cursor-not-allowed'
                        }`}>
                        <i className="fa-solid fa-chevron-left"></i> 上一步
                      </button>

                      {/* Concept Step Indicator */}
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-black text-slate-500 bg-slate-100 px-3.5 py-1.5 rounded-full border border-slate-200 hidden sm:inline-block">
                          觀念 {currIdx + 1} / {conceptSequence.length}
                        </span>
                        <div className="flex gap-1.5">
                          {conceptSequence.map((c, idx) => (
                            <span 
                              key={c} 
                              onClick={() => setActiveModalConcept(c)}
                              className={`w-2.5 h-2.5 rounded-full cursor-pointer transition-all ${
                                idx === currIdx ? 'bg-nordic w-6' : 'bg-slate-200 hover:bg-slate-300'
                              }`} 
                            />
                          ))}
                        </div>
                      </div>

                      {/* Next / Finish Button */}
                      {nextConcept ? (
                        <button 
                          onClick={() => setActiveModalConcept(nextConcept)}
                          className="px-5 py-2.5 bg-nordic hover:bg-nordic-dark text-white font-black text-xs md:text-sm rounded-xl shadow-md transition-all flex items-center gap-2 cursor-pointer">
                          下一步 <i className="fa-solid fa-chevron-right"></i>
                        </button>
                      ) : (
                        <button 
                          onClick={() => setActiveModalConcept(null)}
                          className="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-black text-xs md:text-sm rounded-xl shadow-md transition-all flex items-center gap-2 cursor-pointer">
                          完成閱讀 <i className="fa-solid fa-check"></i>
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}
          </div>
        </div>
      );
    };

    // ── TAB 2: 角度換算與象限角 (Quadrant & Coterminal Angles) ──
    const QuadrantTab = () => {
      const [deg, setDeg] = useState(120);
      const canvasRef = useRef(null);
      const w = 680, h = 380;
      useRetinaCanvas(canvasRef, w, h);

      const rad = deg * Math.PI / 180;
      const turns = (deg / 360).toFixed(2);

      // Determine Quadrant / Axis
      const normDeg = ((deg % 360) + 360) % 360;
      let quadLabel = '';
      let quadColor = 'text-blue-600';
      if (normDeg === 0 || normDeg === 90 || normDeg === 180 || normDeg === 270) {
        quadLabel = '象限角（軸線角）';
        quadColor = 'text-lavender';
      } else if (normDeg > 0 && normDeg < 90) {
        quadLabel = '第一象限角 (Q₁)';
        quadColor = 'text-sage';
      } else if (normDeg > 90 && normDeg < 180) {
        quadLabel = '第二象限角 (Q₂)';
        quadColor = 'text-nordic';
      } else if (normDeg > 180 && normDeg < 270) {
        quadLabel = '第三象限角 (Q₃)';
        quadColor = 'text-caramel';
      } else {
        quadLabel = '第四象限角 (Q₄)';
        quadColor = 'text-terracotta';
      }

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.clearRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        const r = 120;

        // Draw Axes
        ctx.strokeStyle = '#A3B1C1';
        ctx.lineWidth = 1.5;
        // X-axis
        ctx.beginPath(); ctx.moveTo(cx - 180, cy); ctx.lineTo(cx + 180, cy); ctx.stroke();
        // Y-axis
        ctx.beginPath(); ctx.moveTo(cx, cy - 160); ctx.lineTo(cx, cy + 160); ctx.stroke();

        ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#546B84';
        ctx.fillText('x (始邊)', cx + 185, cy + 4);
        ctx.fillText('y', cx - 5, cy - 165);

        // Quadrant Background hints
        ctx.font = 'bold 16px "Noto Sans TC", sans-serif';
        ctx.fillStyle = 'rgba(117, 139, 161, 0.22)';
        ctx.fillText('Q₁', cx + 70, cy - 70);
        ctx.fillText('Q₂', cx - 90, cy - 70);
        ctx.fillText('Q₃', cx - 90, cy + 85);
        ctx.fillText('Q₄', cx + 70, cy + 85);

        // Unit Circle
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(122, 148, 168, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Multi-turn Spiral Arc
        const totalRad = deg * Math.PI / 180;
        const isPos = totalRad >= 0;
        const steps = Math.min(Math.abs(deg) * 2, 800);
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const t = (i / steps) * totalRad;
          const spiralR = 25 + (Math.abs(t) / (Math.PI * 4)) * 40;
          const x = cx + spiralR * Math.cos(-t);
          const y = cy + spiralR * Math.sin(-t);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = deg >= 0 ? '#4E7292' : '#A15650';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Terminal Ray OB
        const terminalA = -totalRad;
        const bx = cx + (r + 20) * Math.cos(terminalA);
        const by = cy + (r + 20) * Math.sin(terminalA);

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(bx, by);
        ctx.strokeStyle = '#2B3848';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Terminal point P on circle
        const px = cx + r * Math.cos(terminalA);
        const py = cy + r * Math.sin(terminalA);
        ctx.fillStyle = '#2B3848';
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();

        ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
        ctx.fillText(`終邊 (Terminal)`, bx + (bx >= cx ? 8 : -85), by + (by >= cy ? 15 : -8));

        ctx.restore();
      }, [deg]);

      // Fraction formatting helper for pi
      const getPiFraction = (degree) => {
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        let num = Math.round(degree);
        let den = 180;
        if (num === 0) return '0 \\text{ rad}';
        const isNeg = num < 0;
        num = Math.abs(num);
        const g = gcd(num, den);
        num /= g;
        den /= g;
        let s = isNeg ? '-' : '';
        if (den === 1) return s + (num === 1 ? '\\pi' : `${num}\\pi`) + ' \\text{ rad}';
        if (num === 1) return `${s}\\frac{\\pi}{${den}} \\text{ rad}`;
        return `${s}\\frac{${num}\\pi}{${den}} \\text{ rad}`;
      };

      return (
        <div className="space-y-6 animate-slide-up pb-10">
          <div className="textbook-card p-6 md:p-8 rounded-2xl">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <div className="text-[10px] font-black bg-lavender-light text-lavender border border-lavender-border px-3 py-1 rounded-full inline-block mb-2 uppercase tracking-widest shadow-xs">
                  MODULE 02 · 廣義角與換算
                </div>
                <h2 className="text-3xl md:text-4xl font-bold font-chenyu tracking-wide text-slate-800 flex items-center gap-3">
                  <i className="fa-solid fa-arrows-spin text-lavender"></i>
                  角度/弧度換算與象限同界角
                </h2>
                <p className="text-slate-600 font-bold text-sm mt-1">
                  拖曳角度滑桿觀察正角（逆時針）與負角（順時針）的同界角螺旋軌跡與象限歸屬。
                </p>
              </div>
              <div className="bg-gradient-to-br from-lavender-light to-[#E5E0F0] border border-lavender-border px-5 py-3 rounded-2xl text-center shadow-xs">
                <span className="text-[10px] font-black text-lavender uppercase tracking-widest block mb-1">CONVERSION FORMULA</span>
                <span className="text-lg font-black text-slate-800 font-serif">
                  <MathInline math="1^\circ = \frac{\pi}{180}\text{ rad}" />
                </span>
              </div>
            </div>

            {/* Canvas Stage */}
            <div className="canvas-stage-card p-3 md:p-4 mb-6 relative overflow-hidden flex flex-col items-center justify-center">
              <div className="w-full flex items-center justify-between px-2 pb-2 mb-2 border-b border-[#2B3848]/10 text-[10px] font-black text-slate-400 tracking-wider">
                <span className="flex items-center gap-1.5"><i className="fa-solid fa-compass text-lavender"></i> QUADRANT & SPIRAL ANGLE WORKBENCH</span>
                <span className="bg-[#EAE3D5] text-[#2B3848] px-2 py-0.5 rounded font-mono">STANDARD POSITION</span>
              </div>
              <canvas ref={canvasRef} className="max-w-full h-auto rounded-xl" />
            </div>

            {/* Real-time Math Feedback Panel */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <div className="bg-gradient-to-br from-[#FAF7F2] to-[#F1E9DC] p-5 rounded-2xl border border-[#DDD3C2] text-center shadow-xs">
                <span className="text-xs font-black text-slate-500 uppercase tracking-wider block mb-1">度數制 (Degree)</span>
                <span className="text-3xl font-black text-slate-800 font-serif">{deg}°</span>
                <span className="text-xs text-slate-600 font-bold block mt-1">旋轉 {turns} 圈</span>
              </div>
              <div className="bg-gradient-to-br from-[#FAF7F2] to-[#F1E9DC] p-5 rounded-2xl border border-[#DDD3C2] text-center shadow-xs">
                <span className="text-xs font-black text-slate-500 uppercase tracking-wider block mb-1">弧度精確值 (Radian)</span>
                <div className="text-2xl font-black text-slate-800 font-serif">
                  <MathInline math={getPiFraction(deg)} />
                </div>
                <span className="text-xs text-slate-600 font-bold block mt-1">實數值 ≈ {rad.toFixed(3)} rad</span>
              </div>
              <div className="bg-gradient-to-br from-[#FAF7F2] to-[#F1E9DC] p-5 rounded-2xl border border-[#DDD3C2] text-center shadow-xs">
                <span className="text-xs font-black text-slate-500 uppercase tracking-wider block mb-1">象限位置 (Quadrant)</span>
                <span className={`text-xl font-black ${quadColor}`}>{quadLabel}</span>
                <span className="text-xs text-slate-600 font-bold block mt-1">標準位置角</span>
              </div>
            </div>

            {/* Slider */}
            <div className="control-box-card p-6 mb-6">
              <div className="flex justify-between items-center mb-3">
                <label className="text-sm font-black text-slate-700">調整角度 θ (-720° ~ +720°)</label>
                <span className="text-slate-800 font-black text-base bg-lavender-light px-3 py-0.5 rounded-lg border border-lavender-border shadow-xs">{deg}°</span>
              </div>
              <input type="range" min="-720" max="720" step="15" value={deg}
                onChange={e => setDeg(parseInt(e.target.value))} className="w-full mb-4" />

              {/* Quick Presets for Special Angles - Vertical Fractions */}
              <div>
                <span className="text-xs font-black text-slate-500 uppercase block mb-2">常用特殊角快速切換：</span>
                <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                  {[
                    { deg: '30°', math: '\\frac{\\pi}{6}', v: 30 },
                    { deg: '45°', math: '\\frac{\\pi}{4}', v: 45 },
                    { deg: '60°', math: '\\frac{\\pi}{3}', v: 60 },
                    { deg: '90°', math: '\\frac{\\pi}{2}', v: 90 },
                    { deg: '120°', math: '\\frac{2\\pi}{3}', v: 120 },
                    { deg: '180°', math: '\\pi', v: 180 },
                    { deg: '270°', math: '\\frac{3\\pi}{2}', v: 270 },
                    { deg: '360°', math: '2\\pi', v: 360 },
                  ].map(b => (
                    <button key={b.v} onClick={() => setDeg(b.v)}
                      className={`py-2 px-1 rounded-xl text-xs font-black transition-all border flex items-center justify-center gap-1 min-h-[46px] shadow-xs ${
                        deg === b.v
                          ? 'bg-slate-800 text-white border-slate-900 shadow-md'
                          : 'bg-[#FAF7F2] text-slate-700 border-[#DDD3C2] hover:bg-lavender-light hover:text-slate-900 hover:border-lavender-border'
                      }`}>
                      <span>{b.deg}</span>
                      <span className="inline-flex items-center">
                        (<MathInline math={b.math} />)
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ── TAB 3: 扇形弧長與面積實驗室 (Sector Area & Arc Length) ──
    const SectorTab = () => {
      const [r, setR] = useState(8);
      const [theta, setTheta] = useState(1.2); // rad
      const canvasRef = useRef(null);
      const w = 680, h = 380;
      useRetinaCanvas(canvasRef, w, h);

      // Detect if angle is dragged/set to maximum (full circle 2π = 360°)
      const isFullCircle = theta >= Math.PI * 2 - 0.03;
      const effectiveTheta = isFullCircle ? Math.PI * 2 : theta;

      const arcLength = (r * effectiveTheta).toFixed(2);
      const area = (0.5 * r * r * effectiveTheta).toFixed(2);
      const fullCircleArea = (Math.PI * r * r).toFixed(2);
      const ratio = isFullCircle ? '100.0' : ((effectiveTheta / (2 * Math.PI)) * 100).toFixed(1);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.clearRect(0, 0, w, h);

        const cx = 250, cy = 190;
        // Dynamic scaling: clamp to prevent clipping at large r (fits nicely from r=1 to r=15)
        const drawR = 48 + (r / 15) * 88;

        // Background subtle grid
        ctx.strokeStyle = 'rgba(43, 56, 72, 0.04)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

        // Full Circle Dashed Outline
        ctx.beginPath();
        ctx.arc(cx, cy, drawR, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Sector Fill with Warm Morandi Sage Gradient
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, drawR, 0, -effectiveTheta, true);
        ctx.closePath();
        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, drawR);
        grad.addColorStop(0, 'rgba(78, 120, 105, 0.28)');
        grad.addColorStop(1, 'rgba(78, 120, 105, 0.12)');
        ctx.fillStyle = grad;
        ctx.fill();

        // Radii OA & OB
        ctx.beginPath();
        ctx.moveTo(cx, cy); ctx.lineTo(cx + drawR, cy);
        ctx.moveTo(cx, cy); ctx.lineTo(cx + drawR * Math.cos(-effectiveTheta), cy + drawR * Math.sin(-effectiveTheta));
        ctx.strokeStyle = '#2B3848';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Arc Highlight
        ctx.beginPath();
        ctx.arc(cx, cy, drawR, 0, -effectiveTheta, true);
        ctx.strokeStyle = '#4E7869';
        ctx.lineWidth = 4.5;
        ctx.stroke();

        // Center Point O
        ctx.fillStyle = '#2B3848';
        ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();

        // Angle Arc at Origin
        if (effectiveTheta > 0.15 && !isFullCircle) {
          const angleArcR = Math.min(26, drawR * 0.38);
          ctx.beginPath();
          ctx.arc(cx, cy, angleArcR, 0, -effectiveTheta, true);
          ctx.strokeStyle = '#A37547';
          ctx.lineWidth = 2.2;
          ctx.stroke();
        }

        // 1. Arc Length Badge (Positioned along mid-arc with safe radial offset)
        const midA = -effectiveTheta / 2;
        const arcLabelDist = drawR + 24;
        const arcX = cx + arcLabelDist * Math.cos(midA);
        const arcY = cy + arcLabelDist * Math.sin(midA);
        
        let arcAlign = 'center';
        if (Math.cos(midA) < -0.3) arcAlign = 'right';
        else if (Math.cos(midA) > 0.3) arcAlign = 'left';

        drawCanvasBadge(ctx, `弧長 s = ${arcLength} cm`, isFullCircle ? cx - drawR - 24 : arcX, isFullCircle ? cy : arcY, {
          textColor: '#325749',
          bgColor: 'rgba(242, 247, 244, 0.96)',
          borderColor: '#CBE2D7',
          align: isFullCircle ? 'right' : arcAlign,
          fontSize: 11
        });

        // 2. Area Badge (Smart Anti-Collision Placement)
        let areaX, areaY;
        if (isFullCircle) {
          areaX = cx;
          areaY = cy - drawR * 0.38;
        } else if (effectiveTheta >= 3.6) {
          areaX = cx;
          areaY = cy - drawR * 0.42;
        } else if (effectiveTheta < 0.65) {
          areaX = cx + (drawR + 24) * Math.cos(midA);
          areaY = cy + (drawR + 24) * Math.sin(midA) + 26;
        } else {
          areaX = cx + (drawR * 0.55) * Math.cos(midA);
          areaY = cy + (drawR * 0.55) * Math.sin(midA);
        }

        drawCanvasBadge(ctx, `面積 A = ${area} cm²`, areaX, areaY, {
          textColor: '#24483B',
          bgColor: 'rgba(235, 244, 240, 0.96)',
          borderColor: '#B8D9C9',
          align: 'center',
          fontSize: 11
        });

        // 3. Radius Badge along OA
        const radBadgeY = (isFullCircle || effectiveTheta > 5.7 || (effectiveTheta > 3.0 && effectiveTheta < 3.4)) ? cy - 14 : cy + 16;
        drawCanvasBadge(ctx, `r = ${r} cm`, cx + drawR * 0.5, radBadgeY, {
          textColor: '#4E7292',
          bgColor: 'rgba(240, 245, 250, 0.96)',
          borderColor: '#D0DFEC',
          align: 'center',
          fontSize: 11
        });

        ctx.restore();
      }, [r, theta, effectiveTheta, isFullCircle]);

      return (
        <div className="space-y-6 animate-slide-up pb-10">
          <div className="textbook-card p-6 md:p-8 rounded-2xl">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <div className="text-[10px] font-black bg-sage-light text-sage border border-sage-border px-3 py-1 rounded-full inline-block mb-2 uppercase tracking-widest shadow-xs">
                  MODULE 03 · 核心公式
                </div>
                <h2 className="text-3xl md:text-4xl font-bold font-chenyu tracking-wide text-slate-800 flex items-center gap-3">
                  <i className="fa-solid fa-pie-chart text-sage"></i>
                  扇形弧長與面積實驗室
                </h2>
                <p className="text-slate-600 font-bold text-sm mt-1">
                  動態調整半徑與圓心角（弳），即時計算扇形弧長 <MathInline math="s=r\theta" /> 與面積 <MathInline math="A=\frac{1}{2}r^2\theta=\frac{1}{2}rs" />。
                </p>
              </div>
              <div className="bg-gradient-to-br from-sage-light to-[#DCEDE3] border border-sage-border px-5 py-3 rounded-2xl text-center shadow-xs">
                <span className="text-[10px] font-black text-sage uppercase tracking-widest block mb-1">SECTOR FORMULA</span>
                <span className="text-lg font-black text-sage-dark font-serif flex items-center justify-center">
                  <MathInline math="A = \frac{1}{2} r^2 \theta = \frac{1}{2} r s" className="text-xl font-bold" />
                </span>
              </div>
            </div>

            {/* Canvas Stage */}
            <div className="canvas-stage-card p-3 md:p-4 mb-6 relative overflow-hidden flex flex-col items-center justify-center">
              <div className="w-full flex items-center justify-between px-2 pb-2 mb-2 border-b border-[#2B3848]/10 text-[10px] font-black text-slate-400 tracking-wider">
                <span className="flex items-center gap-1.5"><i className="fa-solid fa-shapes text-sage"></i> SECTOR GEOMETRY & PROPORTION LAB</span>
                <span className="bg-[#EAE3D5] text-[#2B3848] px-2 py-0.5 rounded font-mono">DYNAMIC SCALING</span>
              </div>
              <canvas ref={canvasRef} className="max-w-full h-auto rounded-xl" />
            </div>

            {/* Real-time Math Output Cards */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <div className="bg-gradient-to-br from-nordic-light to-[#DFEAF3] p-5 rounded-2xl border border-nordic-border text-center shadow-xs">
                <span className="text-xs font-black text-nordic uppercase tracking-wider block mb-1">計算弧長 (Arc Length)</span>
                <div className="text-3xl font-black text-nordic-dark font-serif mb-1">{arcLength} <span className="text-sm font-sans">cm</span></div>
                <span className="text-xs text-nordic font-bold font-serif flex items-center justify-center">
                  <MathInline math={`s = ${r} \\times ${effectiveTheta.toFixed(2)}`} />
                </span>
              </div>

              <div className="bg-gradient-to-br from-sage-light to-[#DCECE3] p-5 rounded-2xl border border-sage-border text-center shadow-xs">
                <span className="text-xs font-black text-sage uppercase tracking-wider block mb-1">扇形面積 (Sector Area)</span>
                <div className="text-3xl font-black text-sage-dark font-serif mb-1">{area} <span className="text-sm font-sans">cm²</span></div>
                <span className="text-xs text-sage font-bold font-serif flex items-center justify-center">
                  <MathInline math={`A = \\frac{1}{2} \\times ${r}^2 \\times ${effectiveTheta.toFixed(2)}`} />
                </span>
              </div>

              <div className="bg-gradient-to-br from-caramel-light to-[#F3E6D5] p-5 rounded-2xl border border-caramel-border text-center shadow-xs">
                <span className="text-xs font-black text-caramel uppercase tracking-wider block mb-1">佔全圓比例 (Proportion)</span>
                <div className="text-3xl font-black text-caramel-dark font-serif mb-1">{ratio}%</div>
                <span className="text-xs text-caramel font-bold">全圓面積 ≈ {fullCircleArea} cm²</span>
              </div>
            </div>

            {/* Parameter Sliders */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 control-box-card p-6 mb-6">
              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-black text-slate-700">半徑 r (1 ~ 15 cm)</label>
                  <span className="text-slate-800 font-black text-base bg-sage-light px-3 py-0.5 rounded-lg border border-sage-border shadow-xs">{r} cm</span>
                </div>
                <input type="range" min="3" max="15" step="0.5" value={r}
                  onChange={e => setR(parseFloat(e.target.value))} className="w-full" />

    // ── TAB 5: 弧度三角比與工程計算機 (Trig Functions & CASIO Simulator) ──

          ctx.strokeStyle = '#A37547';
          ctx.lineWidth = 2;
          ctx.stroke();

        ctx.strokeStyle = '#2B3848'; ctx.lineWidth = 2.5; ctx.stroke();

        // Projections

        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy);
        ctx.strokeStyle = '#4E7292'; ctx.lineWidth = 3.5; ctx.stroke();

        // sin projection on y-axis (terracotta)

        const waveStartX = 310;

        ctx.beginPath();
        for (let x = 0; x <= waveW; x += 2) {

        ctx.strokeStyle = 'rgba(161, 86, 80, 0.45)'; ctx.lineWidth = 2; ctx.stroke();

          }

          return Number.isFinite(res) ? Number(res.toFixed(8)).toString() : 'Error';
        } catch {

    // ── TAB 8 (UNIT 02 - MODULE 07): 單位圓與正弦波生成實驗室 ──
    const PeriodicSineTab = () => {
      const [angle, setAngle] = useState(1.0); // 0 to 4pi
      const [isAnimating, setIsAnimating] = useState(false);
      const [animSpeed, setAnimSpeed] = useState(1);
      const canvasRef = useRef(null);
      const animFrameRef = useRef(null);
      const w = 680, h = 380;
      useRetinaCanvas(canvasRef, w, h);

      useEffect(() => {
        if (!isAnimating) return;
        let lastTime = performance.now();
        const loop = (now) => {
          const dt = (now - lastTime) / 1000;
          lastTime = now;
          setAngle(prev => {
            let next = prev + dt * 0.85 * animSpeed;
            if (next > 4 * Math.PI) next = 0;
            return next;
          });
          animFrameRef.current = requestAnimationFrame(loop);
        };
        animFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [isAnimating, animSpeed]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.clearRect(0, 0, w, h);

        // Background Subtle Grid
        ctx.strokeStyle = 'rgba(221, 211, 194, 0.4)';
        ctx.lineWidth = 1;
        for (let x = 20; x < w; x += 30) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 20; y < h; y += 30) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // Partition dividing line
        ctx.strokeStyle = 'rgba(78, 114, 146, 0.25)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(200, 20); ctx.lineTo(200, h - 20); ctx.stroke();
        ctx.setLineDash([]);

        // ── LEFT: Unit Circle ──
        const cx = 105, cy = 190, R = 65;

        // Circle Axes
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx - R - 25, cy); ctx.lineTo(cx + R + 25, cy);
        ctx.moveTo(cx, cy - R - 25); ctx.lineTo(cx, cy + R + 25);
        ctx.stroke();

        // Axis labels
        ctx.fillStyle = '#64748B';
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('u', cx + R + 32, cy);
        ctx.fillText('v', cx, cy - R - 32);

        // Unit Circle
        ctx.strokeStyle = '#4E7292';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, 2 * Math.PI);
        ctx.stroke();

        // Angle Sector Fill
        const normAngle = angle % (2 * Math.PI);
        ctx.fillStyle = 'rgba(78, 114, 146, 0.15)';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R, 0, -normAngle, true);
        ctx.closePath();
        ctx.fill();

        // Angle Arc Indicator
        ctx.strokeStyle = '#C59B63';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, -normAngle, true);
        ctx.stroke();

        // Current Rotating Point P(cos x, sin x)
        const px = cx + R * Math.cos(normAngle);
        const py = cy - R * Math.sin(normAngle);

        // Radius Vector OP
        ctx.strokeStyle = '#2B3848';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy); ctx.lineTo(px, py);
        ctx.stroke();

        // Horizontal Cosine Projection (Blue)
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.85)';
        ctx.lineWidth = 2;
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.moveTo(px, py); ctx.lineTo(cx, py);
        ctx.moveTo(cx, cy); ctx.lineTo(px, cy);
        ctx.stroke();
        ctx.setLineDash([]);

        // Vertical Sine Projection (Green / Terracotta)
        const sinVal = Math.sin(angle);
        ctx.strokeStyle = sinVal >= 0 ? '#10B981' : '#E11D48';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(px, cy); ctx.lineTo(px, py);
        ctx.stroke();

        // Point P Dot
        ctx.fillStyle = '#C59B63';
        ctx.beginPath(); ctx.arc(px, py, 6, 0, 2 * Math.PI); ctx.fill();
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();

        // Badge at Unit Circle
        drawCanvasBadge(ctx, `P(cos x, sin x)`, px, py - 18, {
          fontSize: 10,
          bgColor: 'rgba(250, 247, 242, 0.95)',
          borderColor: '#C59B63'
        });

        // ── RIGHT: Cartesian Wave Graph y = sin x ──
        const ox = 225, oy = 190;
        const graphW = 425;
        const scaleX = graphW / (4 * Math.PI); // px per rad
        const scaleY = R; // 1 unit = R px

        // Graph Axes
        ctx.strokeStyle = '#64748B';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ox, oy); ctx.lineTo(ox + graphW + 15, oy); // X Axis
        ctx.moveTo(ox, oy - scaleY - 25); ctx.lineTo(ox, oy + scaleY + 25); // Y Axis
        ctx.stroke();

        // Axis Arrows
        ctx.fillStyle = '#64748B';
        ctx.beginPath();
        ctx.moveTo(ox + graphW + 18, oy); ctx.lineTo(ox + graphW + 10, oy - 4); ctx.lineTo(ox + graphW + 10, oy + 4); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(ox, oy - scaleY - 28); ctx.lineTo(ox - 4, oy - scaleY - 20); ctx.lineTo(ox + 4, oy - scaleY - 20); ctx.fill();

        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.fillText('x (rad)', ox + graphW + 5, oy + 16);
        ctx.fillText('y', ox - 14, oy - scaleY - 20);

        // Y Ticks
        [-1, 1].forEach(v => {
          const yPos = oy - v * scaleY;
          ctx.strokeStyle = '#CBD5E1';
          ctx.beginPath(); ctx.moveTo(ox - 4, yPos); ctx.lineTo(ox + graphW, yPos); ctx.stroke();
          ctx.fillStyle = '#475569';
          ctx.font = 'bold 10px Fira Code, monospace';
          ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          ctx.fillText(v > 0 ? '+1' : '-1', ox - 7, yPos);
        });
        ctx.fillText('0', ox - 7, oy);

        // X Ticks (0, pi/2, pi, 3pi/2, 2pi, 5pi/2, 3pi, 7pi/2, 4pi)
        const ticks = [
          { val: Math.PI / 2, label: 'π/2' },
          { val: Math.PI, label: 'π' },
          { val: 3 * Math.PI / 2, label: '3π/2' },
          { val: 2 * Math.PI, label: '2π' },
          { val: 5 * Math.PI / 2, label: '5π/2' },
          { val: 3 * Math.PI, label: '3π' },
          { val: 7 * Math.PI / 2, label: '7π/2' },
          { val: 4 * Math.PI, label: '4π' },
        ];

        ticks.forEach(t => {
          const tx = ox + t.val * scaleX;
          ctx.strokeStyle = 'rgba(203, 213, 225, 0.6)';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(tx, oy - scaleY - 10); ctx.lineTo(tx, oy + scaleY + 10); ctx.stroke();
          ctx.fillStyle = '#64748B';
          ctx.font = 'bold 10px Fira Code, monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText(t.label, tx, oy + 5);
        });

        // 1. Ghost full wave 0 to 4pi (Subtle)
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        for (let t = 0; t <= 4 * Math.PI; t += 0.05) {
          const gx = ox + t * scaleX;
          const gy = oy - Math.sin(t) * scaleY;
          if (t === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // 2. Active Solid Wave 0 to angle
        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        for (let t = 0; t <= angle; t += 0.03) {
          const gx = ox + t * scaleX;
          const gy = oy - Math.sin(t) * scaleY;
          if (t === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
        }
        ctx.stroke();

        // 3. Five Key Points on [0, 2pi]
        const keyPts = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2, 2 * Math.PI];
        keyPts.forEach(pt => {
          const kx = ox + pt * scaleX;
          const ky = oy - Math.sin(pt) * scaleY;
          const isPassed = angle >= pt;
          ctx.fillStyle = isPassed ? '#10B981' : '#94A3B8';
          ctx.beginPath(); ctx.arc(kx, ky, isPassed ? 4.5 : 3, 0, 2 * Math.PI); ctx.fill();
        });

        // 4. Current Point on Wave (gx, gy)
        const curGx = ox + angle * scaleX;
        const curGy = oy - Math.sin(angle) * scaleY;

        // Dynamic Laser Sync Line from Unit Circle P to Wave Point
        ctx.strokeStyle = 'rgba(197, 155, 99, 0.85)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(curGx, curGy);
        ctx.stroke();
        ctx.setLineDash([]);

        // Vertical drop line to x-axis
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(curGx, oy); ctx.lineTo(curGx, curGy);
        ctx.stroke();

        // Wave Current Point Dot
        ctx.fillStyle = '#C59B63';
        ctx.beginPath(); ctx.arc(curGx, curGy, 6.5, 0, 2 * Math.PI); ctx.fill();
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();

        drawCanvasBadge(ctx, `(${angle.toFixed(2)}, ${Math.sin(angle).toFixed(2)})`, curGx, curGy - 18, {
          fontSize: 10,
          fontWeight: 'bold',
          bgColor: 'rgba(250, 247, 242, 0.95)',
          borderColor: '#10B981'
        });

        ctx.restore();
      }, [angle]);

      const deg = (angle * 180 / Math.PI).toFixed(1);
      const sinVal = Math.sin(angle);
      const normRad = angle % (2 * Math.PI);
      
      let quadText = '第 I 象限';
      if (normRad > Math.PI / 2 && normRad < Math.PI) quadText = '第 II 象限';
      else if (normRad > Math.PI && normRad < 3 * Math.PI / 2) quadText = '第 III 象限';
      else if (normRad > 3 * Math.PI / 2 && normRad < 2 * Math.PI) quadText = '第 IV 象限';
      else if (Math.abs(normRad - 0) < 0.05 || Math.abs(normRad - 2 * Math.PI) < 0.05) quadText = '正 x 軸 (0 / 2π)';
      else if (Math.abs(normRad - Math.PI / 2) < 0.05) quadText = '正 y 軸 (π/2)';
      else if (Math.abs(normRad - Math.PI) < 0.05) quadText = '負 x 軸 (π)';
      else if (Math.abs(normRad - 3 * Math.PI / 2) < 0.05) quadText = '負 y 軸 (3π/2)';

      let trendText = '函數嚴格遞增 ↗';
      let trendColor = 'text-emerald-700 bg-emerald-50 border-emerald-200';
      if (normRad > Math.PI / 2 && normRad < 3 * Math.PI / 2) {
        trendText = '函數嚴格遞減 ↘';
        trendColor = 'text-amber-700 bg-amber-50 border-amber-200';
      }
      if (Math.abs(normRad - Math.PI / 2) < 0.08) {
        trendText = '波峰極大值 (+1)';
        trendColor = 'text-emerald-800 bg-emerald-100 border-emerald-300 font-black';

        ctx.save();
        ctx.clearRect(0, 0, w, hCanvas);

        // Background grid
        ctx.strokeStyle = 'rgba(221, 211, 194, 0.45)';
        ctx.lineWidth = 1;
        for (let x = 20; x < w; x += 30) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, hCanvas); ctx.stroke();
        }
        for (let y = 20; y < hCanvas; y += 30) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        const ox = 340, oy = 190;
        const scaleX = 42; // px per radian
        const scaleY = 32; // px per unit

        // Axes
        ctx.strokeStyle = '#64748B';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(25, oy); ctx.lineTo(w - 25, oy); // X Axis
        ctx.moveTo(ox, 25); ctx.lineTo(ox, hCanvas - 25); // Y Axis
        ctx.stroke();

        // X Ticks
        const xTicks = [
          { val: -2 * Math.PI, label: '-2π' },
          { val: -Math.PI, label: '-π' },
          { val: Math.PI, label: 'π' },
          { val: 2 * Math.PI, label: '2π' },
          { val: 3 * Math.PI, label: '3π' },
        ];
        xTicks.forEach(t => {
          const tx = ox + t.val * scaleX;
          ctx.strokeStyle = 'rgba(203, 213, 225, 0.6)';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(tx, 30); ctx.lineTo(tx, hCanvas - 30); ctx.stroke();
          ctx.fillStyle = '#64748B';
          ctx.font = 'bold 10px Fira Code, monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText(t.label, tx, oy + 5);
        });

        // Y Ticks
        [-4, -3, -2, -1, 1, 2, 3, 4].forEach(v => {
          const ty = oy - v * scaleY;
          ctx.strokeStyle = 'rgba(203, 213, 225, 0.4)';
          ctx.beginPath(); ctx.moveTo(30, ty); ctx.lineTo(w - 30, ty); ctx.stroke();
          ctx.fillStyle = '#64748B';
          ctx.font = 'bold 9px Fira Code, monospace';
          ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          ctx.fillText(`${v}`, ox - 6, ty);
        });

        // 1. Reference Base Wave y = sin x (Subtle Gray Dashed)
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        for (let gx = -7 * Math.PI; gx <= 7 * Math.PI; gx += 0.05) {
          const cx = ox + gx * scaleX;
          const cy = oy - Math.sin(gx) * scaleY;
          if (gx === -7 * Math.PI) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // 2. Midline y = k (Amber Dashed)
        const my = oy - k * scaleY;
        ctx.strokeStyle = '#D97706';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(35, my); ctx.lineTo(w - 35, my); ctx.stroke();
        ctx.setLineDash([]);

        // 3. Max & Min Envelope Lines
        const maxY = oy - (k + Math.abs(a)) * scaleY;
        const minY = oy - (k - Math.abs(a)) * scaleY;
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(35, maxY); ctx.lineTo(w - 35, maxY); ctx.stroke();
        ctx.strokeStyle = 'rgba(225, 29, 72, 0.4)';
        ctx.beginPath(); ctx.moveTo(35, minY); ctx.lineTo(w - 35, minY); ctx.stroke();
        ctx.setLineDash([]);

        // 4. Period Bracket Region [h, h + 2pi/|b|]
        const period = (2 * Math.PI) / Math.abs(b);
        const pStartX = ox + h * scaleX;
        const pEndX = ox + (h + period) * scaleX;
        ctx.fillStyle = 'rgba(197, 155, 99, 0.12)';
        ctx.fillRect(pStartX, 35, pEndX - pStartX, hCanvas - 70);

        ctx.strokeStyle = '#C59B63';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pStartX, 40); ctx.lineTo(pStartX, hCanvas - 40);
        ctx.moveTo(pEndX, 40); ctx.lineTo(pEndX, hCanvas - 40);
        ctx.stroke();

        // 5. Transformed Wave y = a * sin(b * (x - h)) + k (Bold Lavender/Purple)
        ctx.strokeStyle = '#664980';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        for (let gx = -7 * Math.PI; gx <= 7 * Math.PI; gx += 0.04) {
          const val = a * Math.sin(b * (gx - h)) + k;
          const cx = ox + gx * scaleX;
          const cy = oy - val * scaleY;
          if (gx === -7 * Math.PI) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
        }
        ctx.stroke();

        // 6. Highlight Peak Point on first period
        const peakX = h + (Math.PI / 2) / b;
        const peakVal = k + a;
        const pkCx = ox + peakX * scaleX;
        const pkCy = oy - peakVal * scaleY;
        if (pkCx >= 40 && pkCx <= w - 40) {
          ctx.fillStyle = '#10B981';
          ctx.beginPath(); ctx.arc(pkCx, pkCy, 5.5, 0, 2 * Math.PI); ctx.fill();
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
          drawCanvasBadge(ctx, `最高點 (${peakX.toFixed(2)}, ${peakVal.toFixed(1)})`, pkCx, pkCy - 16, {
            fontSize: 9,
            bgColor: 'rgba(250, 247, 242, 0.95)',
            borderColor: '#10B981'
          });
        }

        // Badges
        drawCanvasBadge(ctx, `基準 y = sin x`, ox - 140, oy - Math.sin(-140/scaleX) * scaleY - 15, {
          fontSize: 9,
          textColor: '#64748B',
          bgColor: 'rgba(241, 245, 249, 0.9)',
          borderColor: '#CBD5E1'
        });

        drawCanvasBadge(ctx, `中線 y = ${k.toFixed(1)}`, w - 90, my - 12, {
          fontSize: 9,
          textColor: '#D97706',
          bgColor: 'rgba(254, 243, 199, 0.95)',
          borderColor: '#F59E0B'
        });

        ctx.restore();
      }, [a, b, h, k]);

      const periodVal = ((2 * Math.PI) / Math.abs(b)).toFixed(2);

      const maxVal = (k + Math.abs(a)).toFixed(1);

        str += '\\sin(';

        if (h !== 0) {
          const hVal = parseFloat(Math.abs(h).toFixed(2));
          if (b !== 1 && b !== -1) {
             str += `(x ${h > 0 ? '-' : '+'} ${hVal})`;
          } else {
             str += `x ${h > 0 ? '-' : '+'} ${hVal}`;
          }
        } else {
          str += 'x';
        }
        
        str += ')';
        
        if (k !== 0) {
          str += k > 0 ? ` + ${k}` : ` - ${Math.abs(k)}`;
        }
        return str;
      }, [a, b, h, k]);

            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
