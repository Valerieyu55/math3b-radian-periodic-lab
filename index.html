                  </label>
                  <span className="font-mono font-bold text-xs bg-[#FAF7F2] border border-[#DDD3C2] px-3 py-1 rounded-lg text-lavender-dark shadow-xs">
                    {a.toFixed(1)} (振幅 A = {Math.abs(a).toFixed(1)})
                  </span>
                </div>
                <input type="range" min="-3" max="3" step="0.5" value={a} onChange={e => setA(parseFloat(e.target.value))}
                  className="w-full accent-lavender h-2 bg-[#DDD3C2] rounded-lg cursor-pointer" />
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-black text-slate-700 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-lavender text-white flex items-center justify-center text-xs font-black">b</span>
                    頻率係數 <MathInline math="b" /> (水平伸縮)
                  </label>
                  <span className="font-mono font-bold text-xs bg-[#FAF7F2] border border-[#DDD3C2] px-3 py-1 rounded-lg text-lavender-dark shadow-xs">
                    {b.toFixed(1)} (週期 T = {periodVal})
                  </span>
                </div>
                <input type="range" min="0.5" max="4" step="0.5" value={b} onChange={e => setB(parseFloat(e.target.value))}
                  className="w-full accent-lavender h-2 bg-[#DDD3C2] rounded-lg cursor-pointer" />
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-black text-slate-700 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-caramel text-white flex items-center justify-center text-xs font-black">h</span>
                    水平平移 <MathInline math="h" /> (向右 / 向左)
                  </label>
                  <span className="font-mono font-bold text-xs bg-[#FAF7F2] border border-[#DDD3C2] px-3 py-1 rounded-lg text-caramel-dark shadow-xs">
                    {h >= 0 ? `+${h.toFixed(2)}` : h.toFixed(2)} rad ({h >= 0 ? '向右' : '向左'})
                  </span>
                </div>
                <input type="range" min={-Math.PI} max={Math.PI} step={Math.PI / 12} value={h} onChange={e => setH(parseFloat(e.target.value))}
                  className="w-full accent-caramel h-2 bg-[#DDD3C2] rounded-lg cursor-pointer" />
              </div>

              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="text-sm font-black text-slate-700 flex items-center gap-2">
                    <span className="w-6 h-6 rounded-full bg-sage text-white flex items-center justify-center text-xs font-black">k</span>
                    鉛直平移 <MathInline math="k" /> (向上 / 向下)
                  </label>
                  <span className="font-mono font-bold text-xs bg-[#FAF7F2] border border-[#DDD3C2] px-3 py-1 rounded-lg text-sage-dark shadow-xs">
                    {k >= 0 ? `+${k.toFixed(1)}` : k.toFixed(1)} (中線 y = {k.toFixed(1)})
                  </span>
                </div>
                <input type="range" min="-3" max="3" step="0.5" value={k} onChange={e => setK(parseFloat(e.target.value))}
                  className="w-full accent-sage h-2 bg-[#DDD3C2] rounded-lg cursor-pointer" />
              </div>
            </div>

            {/* Analytical Cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-gradient-to-br from-[#F6F3F9] to-[#ECE5F4] border border-[#DDD3EA] p-4 rounded-2xl shadow-xs">
                <span className="text-[10px] font-black text-lavender uppercase tracking-widest block mb-1">AMPLITUDE (振幅)</span>
                <div className="text-2xl font-black text-lavender-dark">{ampVal}</div>
                <span className="text-xs font-bold text-slate-600 block mt-1">
                  <MathInline math="A = |a| = \frac{\text{Max} - \text{Min}}{2}" />
                </span>
              </div>

              <div className="bg-gradient-to-br from-[#F2F6F9] to-[#E5EEF4] border border-[#CDE0ED] p-4 rounded-2xl shadow-xs">
                <span className="text-[10px] font-black text-nordic uppercase tracking-widest block mb-1">PERIOD (週期)</span>
                <div className="text-2xl font-black text-nordic-dark">{periodVal}</div>
                <span className="text-xs font-bold text-slate-600 block mt-1">
                  <MathInline math={`T = \\frac{2\\pi}{|b|} = \\frac{2\\pi}{${Math.abs(b)}}`} />
                </span>
              </div>

              <div className="bg-gradient-to-br from-[#F2F7F4] to-[#E3EFE9] border border-[#CBE2D7] p-4 rounded-2xl shadow-xs">
                <span className="text-[10px] font-black text-sage uppercase tracking-widest block mb-1">RANGE (值域範圍)</span>
                <div className="text-xl font-black text-sage-dark">[{minVal}, {maxVal}]</div>
                <span className="text-xs font-bold text-slate-600 block mt-1">
                  <MathInline math="[k - |a|, k + |a|]" />
                </span>
              </div>

              <div className="bg-gradient-to-br from-[#FAF5ED] to-[#F4EADB] border border-[#E8DAC5] p-4 rounded-2xl shadow-xs">
                <span className="text-[10px] font-black text-caramel uppercase tracking-widest block mb-1">MIDLINE (平衡中線)</span>
                <div className="text-xl font-black text-caramel-dark">y = {k.toFixed(1)}</div>
                <span className="text-xs font-bold text-slate-600 block mt-1">
                  <MathInline math="y = \frac{\text{Max} + \text{Min}}{2}" />
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ── TAB 10 (UNIT 02 - MODULE 09): 生活中的週期性現象數學模型 ──
    const PeriodicModelsTab = () => {
      const [modelType, setModelType] = useState('ferris'); // 'ferris', 'tide', 'lunar'
      const [tVal, setTVal] = useState(4.0);
      const [isAnimating, setIsAnimating] = useState(false);

      // Ferris Wheel state
      const [wheelR, setWheelR] = useState(25); // meters
      const [wheelH0, setWheelH0] = useState(30); // center height meters
      const [wheelPeriod, setWheelPeriod] = useState(12); // minutes

      // Tides state
      const [tideAmp, setTideAmp] = useState(3.0); // meters
      const [tideMean, setTideMean] = useState(7.0); // meters
      const [safeDraft, setSafeDraft] = useState(8.5); // meters

      // Lunar state
      const [lunarDay, setLunarDay] = useState(15.0); // 0 to 29.5 days

      const canvasRef = useRef(null);
      const animFrameRef = useRef(null);
      const w = 680, hCanvas = 380;
      useRetinaCanvas(canvasRef, w, hCanvas);

      useEffect(() => {
        if (!isAnimating) return;
        let lastTime = performance.now();
        const loop = (now) => {
          const dt = (now - lastTime) / 1000;
          lastTime = now;
          if (modelType === 'ferris') {
            setTVal(prev => {
              let next = prev + dt * 1.5;
              if (next > 2 * wheelPeriod) next = 0;
              return next;
            });
          } else if (modelType === 'tide') {
            setTVal(prev => {
              let next = prev + dt * 1.2;
              if (next > 24) next = 0;
              return next;
            });
          } else if (modelType === 'lunar') {
            setLunarDay(prev => {
              let next = prev + dt * 1.8;
              if (next > 29.5) next = 0;
              return next;
            });
          }
          animFrameRef.current = requestAnimationFrame(loop);
        };
        animFrameRef.current = requestAnimationFrame(loop);
        return () => {
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };
      }, [isAnimating, modelType, wheelPeriod]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.clearRect(0, 0, w, hCanvas);

        // Grid
        ctx.strokeStyle = 'rgba(221, 211, 194, 0.4)';
        ctx.lineWidth = 1;
        for (let x = 20; x < w; x += 30) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, hCanvas); ctx.stroke();
        }
        for (let y = 20; y < hCanvas; y += 30) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // Partition dividing line
        ctx.strokeStyle = 'rgba(78, 114, 146, 0.25)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(250, 20); ctx.lineTo(250, hCanvas - 20); ctx.stroke();
        ctx.setLineDash([]);

        if (modelType === 'ferris') {
          // ── FERRIS WHEEL MODEL ──
          const fcx = 125, fcy = 190, fR = 75;
          const groundY = fcy + (wheelH0 / wheelR) * (fR * 0.7);

          // Ground
          ctx.fillStyle = '#E2D9C8';
          ctx.fillRect(15, groundY, 220, hCanvas - groundY);
          ctx.strokeStyle = '#8C7860'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(15, groundY); ctx.lineTo(235, groundY); ctx.stroke();

          // Support Pillars
          ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(fcx, fcy); ctx.lineTo(fcx - 55, groundY);
          ctx.moveTo(fcx, fcy); ctx.lineTo(fcx + 55, groundY);
          ctx.stroke();

          // Wheel rim
          ctx.strokeStyle = '#4E7292'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(fcx, fcy, fR, 0, 2 * Math.PI); ctx.stroke();

          // Angle calculation: starts at lowest point (t=0 => angle = -pi/2), rotating counter-clockwise
          const omega = (2 * Math.PI) / wheelPeriod;
          const theta = omega * tVal - Math.PI / 2;

          // 8 Spokes & Gondolas
          for (let i = 0; i < 8; i++) {
            const spkAngle = (i * 2 * Math.PI / 8) + (omega * tVal - Math.PI / 2);
            const sx = fcx + fR * Math.cos(spkAngle);
            const sy = fcy - fR * Math.sin(spkAngle);
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(fcx, fcy); ctx.lineTo(sx, sy); ctx.stroke();

            // Small gondola dot
            ctx.fillStyle = '#94A3B8';
            ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 2 * Math.PI); ctx.fill();
          }

          // Active Main Gondola (tVal)
          const gX = fcx + fR * Math.cos(theta);
          const gY = fcy - fR * Math.sin(theta);

          // Current Height Plumb line to ground
          ctx.strokeStyle = 'rgba(197, 155, 99, 0.8)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(gX, gY); ctx.lineTo(gX, groundY); ctx.stroke();
          ctx.setLineDash([]);

          // Gondola Badge
          ctx.fillStyle = '#C59B63';
          ctx.beginPath(); ctx.arc(gX, gY, 7, 0, 2 * Math.PI); ctx.fill();
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();

          const curHeight = -wheelR * Math.cos(omega * tVal) + wheelH0;
          drawCanvasBadge(ctx, `車廂高度 ${curHeight.toFixed(1)} m`, gX, gY - 18, {
            fontSize: 9,
            bgColor: 'rgba(250, 247, 242, 0.95)',
            borderColor: '#C59B63'
          });

          // ── RIGHT GRAPH: h(t) vs t ──
          const gx = 280, gy = 260;
          const gw = 370, gh = 180;
          const maxH = wheelH0 + wheelR + 10;
          const scaleT = gw / (2 * wheelPeriod);
          const scaleH = gh / maxH;

          // Axes
          ctx.strokeStyle = '#64748B'; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(gx, gy); ctx.lineTo(gx + gw + 10, gy); // Time axis
          ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - gh - 20); // Height axis
          ctx.stroke();

          ctx.fillStyle = '#64748B'; ctx.font = 'bold 10px Inter, sans-serif';
          ctx.fillText('時間 t (分)', gx + gw - 30, gy + 18);
          ctx.fillText('高度 h (m)', gx - 15, gy - gh - 15);

          // Ticks
          [0, wheelPeriod, 2 * wheelPeriod].forEach(tv => {
            const tx = gx + tv * scaleT;
            ctx.fillStyle = '#64748B';
            ctx.fillText(`${tv}m`, tx, gy + 14);
          });

          // Midline & Max/Min reference
          ctx.strokeStyle = '#CBD5E1'; ctx.setLineDash([3, 3]);
          const midH_Y = gy - wheelH0 * scaleH;
          ctx.beginPath(); ctx.moveTo(gx, midH_Y); ctx.lineTo(gx + gw, midH_Y); ctx.stroke();
          ctx.fillText(`H₀ = ${wheelH0}m`, gx + gw - 65, midH_Y - 5);
          ctx.setLineDash([]);

          // Height Wave
          ctx.strokeStyle = '#4E7292'; ctx.lineWidth = 3;
          ctx.beginPath();
          for (let t = 0; t <= 2 * wheelPeriod; t += 0.2) {
            const val = -wheelR * Math.cos(omega * t) + wheelH0;
            const px = gx + t * scaleT;
            const py = gy - val * scaleH;
            if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();

          // Current Point on Graph
          const ptGx = gx + tVal * scaleT;
          const ptGy = gy - curHeight * scaleH;
          ctx.fillStyle = '#C59B63';
          ctx.beginPath(); ctx.arc(ptGx, ptGy, 6, 0, 2 * Math.PI); ctx.fill();
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();

          drawCanvasBadge(ctx, `(${tVal.toFixed(1)}分, ${curHeight.toFixed(1)}m)`, ptGx, ptGy - 16, {
            fontSize: 9,
            bgColor: 'rgba(250, 247, 242, 0.95)',
            borderColor: '#4E7292'
          });

        } else if (modelType === 'tide') {
          // ── OCEAN TIDES & HARBOR DRAFT MODEL ──
          const omegaTide = (2 * Math.PI) / 12; // 12 hours period
          const curTide = tideAmp * Math.sin(omegaTide * (tVal - 3)) + tideMean;

          // Pier & Harbor left visualization
          const pierX = 35, pierY = 120;
          ctx.fillStyle = '#94A3B8';
          ctx.fillRect(pierX, pierY, 45, hCanvas - pierY - 40);

          // Water surface dynamic height
          const waterBaseY = 240;
          const waterY = waterBaseY - (curTide - tideMean) * 22;

          // Animated Water
          ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.beginPath();
          ctx.moveTo(80, waterY);
          for (let x = 80; x <= 240; x += 10) {
            const waveOffset = Math.sin((x + tVal * 20) * 0.08) * 3;
            ctx.lineTo(x, waterY + waveOffset);
          }
          ctx.lineTo(240, hCanvas - 40);
          ctx.lineTo(80, hCanvas - 40);
          ctx.closePath();
          ctx.fill();

          // Cargo Ship Floating
          const shipX = 140, shipY = waterY - 18;
          ctx.fillStyle = curTide >= safeDraft ? '#059669' : '#DC2626';
          ctx.beginPath();
          ctx.moveTo(shipX - 35, shipY);
          ctx.lineTo(shipX + 35, shipY);
          ctx.lineTo(shipX + 22, shipY + 22);
          ctx.lineTo(shipX - 22, shipY + 22);
          ctx.closePath();
          ctx.fill();

          // Ship Bridge
          ctx.fillStyle = '#FAF7F2';
          ctx.fillRect(shipX - 10, shipY - 14, 20, 14);

          drawCanvasBadge(ctx, curTide >= safeDraft ? '安全水深 ✓' : '吃水不足 ✕', shipX, shipY - 26, {
            fontSize: 9,
            textColor: '#FFFFFF',
            bgColor: curTide >= safeDraft ? '#059669' : '#DC2626',
            borderColor: '#FFFFFF'
          });

          // ── RIGHT GRAPH: Tide Wave over 24 Hours ──
          const gx = 280, gy = 260;
          const gw = 370, gh = 180;
          const scaleT = gw / 24;
          const scaleY = gh / 14;

          // Safe Draft Zone Highlight (Green background when depth >= safeDraft)
          const safeY = gy - safeDraft * scaleY;
          ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
          ctx.fillRect(gx, 40, gw, safeY - 40);

          // Safe Draft Line
          ctx.strokeStyle = '#059669'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
          ctx.beginPath(); ctx.moveTo(gx, safeY); ctx.lineTo(gx + gw, safeY); ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#059669'; ctx.font = 'bold 9px Inter, sans-serif';
          ctx.fillText(`安全門檻: ${safeDraft.toFixed(1)}m`, gx + gw - 85, safeY - 5);

          // Axes
          ctx.strokeStyle = '#64748B'; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(gx, gy); ctx.lineTo(gx + gw + 10, gy);
          ctx.moveTo(gx, gy); ctx.lineTo(gx, 35);
          ctx.stroke();

          // X Ticks (Hours 0, 6, 12, 18, 24)
          [0, 6, 12, 18, 24].forEach(hr => {
            const hx = gx + hr * scaleT;
            ctx.fillStyle = '#64748B'; ctx.font = 'bold 9px Inter, sans-serif';
            ctx.fillText(`${hr}:00`, hx, gy + 14);
          });

          // Tide Wave Curve
          ctx.strokeStyle = '#0284C7'; ctx.lineWidth = 3;
          ctx.beginPath();
          for (let t = 0; t <= 24; t += 0.2) {
            const val = tideAmp * Math.sin(omegaTide * (t - 3)) + tideMean;
            const px = gx + t * scaleT;
            const py = gy - val * scaleY;
            if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();

          // Current Point
          const ptGx = gx + tVal * scaleT;
          const ptGy = gy - curTide * scaleY;
          ctx.fillStyle = curTide >= safeDraft ? '#059669' : '#DC2626';
          ctx.beginPath(); ctx.arc(ptGx, ptGy, 6, 0, 2 * Math.PI); ctx.fill();
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();

          drawCanvasBadge(ctx, `${tVal.toFixed(1)}時: ${curTide.toFixed(2)}m`, ptGx, ptGy - 16, {
            fontSize: 9,
            bgColor: 'rgba(250, 247, 242, 0.95)',
            borderColor: curTide >= safeDraft ? '#059669' : '#DC2626'
          });

        } else if (modelType === 'lunar') {
          // ── LUNAR PHASES MODEL ──
          const lcx = 125, lcy = 190, orbitR = 65;

          // Sun rays from left
          ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)'; ctx.lineWidth = 1.5;
          for (let y = 100; y <= 280; y += 35) {
            ctx.beginPath(); ctx.moveTo(15, y); ctx.lineTo(45, y); ctx.stroke();
          }

          // Earth in center
          ctx.fillStyle = '#3B82F6';
          ctx.beginPath(); ctx.arc(lcx, lcy, 18, 0, 2 * Math.PI); ctx.fill();
          ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 9px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('地球', lcx, lcy);

          // Orbit dashed ring
          ctx.strokeStyle = '#CBD5E1'; ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.arc(lcx, lcy, orbitR, 0, 2 * Math.PI); ctx.stroke();
          ctx.setLineDash([]);

          // Moon orbiting angle: Day 0 => New moon (closest to Sun, left), Day 15 => Full moon (right)
          const moonAngle = (lunarDay / 29.5) * 2 * Math.PI;
          const mx = lcx - orbitR * Math.cos(moonAngle);
          const my = lcy - orbitR * Math.sin(moonAngle);

          // Moon disc
          ctx.fillStyle = '#475569';
          ctx.beginPath(); ctx.arc(mx, my, 9, 0, 2 * Math.PI); ctx.fill();
          ctx.fillStyle = '#FBBF24';
          ctx.beginPath(); ctx.arc(mx, my, 9, Math.PI / 2, -Math.PI / 2); ctx.fill();

          // Illumination percentage
          const illumPercent = (50 + 50 * Math.sin((2 * Math.PI / 29.5) * (lunarDay - 7.375))).toFixed(1);

          drawCanvasBadge(ctx, `農曆 ${lunarDay.toFixed(1)} 日 (${illumPercent}%)`, mx, my - 18, {
            fontSize: 9,
            bgColor: 'rgba(250, 247, 242, 0.95)',
            borderColor: '#F59E0B'
          });

          // ── RIGHT GRAPH: Moon Illumination vs Lunar Day ──
          const gx = 280, gy = 260;
          const gw = 370, gh = 180;
          const scaleD = gw / 29.5;
          const scaleI = gh / 100;

          // Axes
          ctx.strokeStyle = '#64748B'; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(gx, gy); ctx.lineTo(gx + gw + 10, gy);
          ctx.moveTo(gx, gy); ctx.lineTo(gx, 40);
          ctx.stroke();

          // X Ticks (初一, 上弦, 望/滿月, 下弦, 三十)
          [
            { d: 0, l: '初一(朔)' },
            { d: 7.4, l: '初八(上弦)' },
            { d: 14.75, l: '十五(望)' },
            { d: 22.1, l: '廿三(下弦)' },
            { d: 29.5, l: '三十' },
          ].forEach(t => {
            const tx = gx + t.d * scaleD;
            ctx.fillStyle = '#64748B'; ctx.font = 'bold 8px Inter, sans-serif';
            ctx.fillText(t.l, tx, gy + 14);
          });

          // Illumination Wave
          ctx.strokeStyle = '#D97706'; ctx.lineWidth = 3;
          ctx.beginPath();
          for (let d = 0; d <= 29.5; d += 0.2) {
            const val = 50 + 50 * Math.sin((2 * Math.PI / 29.5) * (d - 7.375));
            const px = gx + d * scaleD;
            const py = gy - val * scaleI;
            if (d === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();

          // Current Point
          const curIllum = 50 + 50 * Math.sin((2 * Math.PI / 29.5) * (lunarDay - 7.375));
          const ptGx = gx + lunarDay * scaleD;
          const ptGy = gy - curIllum * scaleI;
          ctx.fillStyle = '#F59E0B';
          ctx.beginPath(); ctx.arc(ptGx, ptGy, 6, 0, 2 * Math.PI); ctx.fill();
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();

          drawCanvasBadge(ctx, `${curIllum.toFixed(1)}%`, ptGx, ptGy - 16, {
            fontSize: 9,
            bgColor: 'rgba(250, 247, 242, 0.95)',
            borderColor: '#F59E0B'
          });
        }

        ctx.restore();
      }, [modelType, tVal, wheelR, wheelH0, wheelPeriod, tideAmp, tideMean, safeDraft, lunarDay]);

      return (
        <div className="space-y-6 animate-slide-up pb-10">
          <div className="textbook-card p-6 md:p-8 rounded-2xl">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <div className="text-[10px] font-black bg-caramel-light text-caramel border border-caramel-border px-3 py-1 rounded-full inline-block mb-2 uppercase tracking-widest shadow-xs">
                  UNIT 02 · MODULE 09 · 素養建模
                </div>
                <h2 className="text-3xl md:text-4xl font-bold font-chenyu tracking-wide text-slate-800 flex items-center gap-3">
                  <i className="fa-solid fa-earth-asia text-caramel"></i>
                  生活週期性現象與三角函數建模
                </h2>
                <p className="text-slate-600 font-bold text-sm mt-1">
                  探索摩天輪車廂高度、海港潮汐水深升降與月相盈虧比例，將自然界規律轉化為週期數學模型。
                </p>

                { icon: 'fa-circle-notch', unit: 'U1', label: '建立弧度的實數本質定義', descNode: <span>透過物理拉直弧長，理解 1 弳 = 弧長等於半徑時的圓心角</span>, tab: 'definition', bg: 'from-[#F2F6F9] to-[#E5EEF4]', border: 'border-[#CDE0ED]' },
                { icon: 'fa-pie-chart', unit: 'U1', label: '靈活運用扇形弧長與面積公式', descNode: <span>掌握 <MathInline math="s = r\theta" /> 與 <MathInline math="A = \frac{1}{2}r^2\theta" /> 的直式對稱結構</span>, tab: 'sector', bg: 'from-[#F2F7F4] to-[#E3EFE9]', border: 'border-[#CBE2D7]' },
                { icon: 'fa-circle-nodes', unit: 'U2', label: '掌握單位圓投影生成正弦波', descNode: <span>動態連線直觀理解點 <MathInline math="P(\cos x, \sin x)" /> 開展為 <MathInline math="y = \sin x" /></span>, tab: 'periodic-sine', bg: 'from-[#F6F3F9] to-[#ECE5F4]', border: 'border-[#DDD3EA]' },
                { icon: 'fa-arrows-up-down-left-right', unit: 'U2', label: '精通正弦圖形平移與伸縮變換', descNode: <span>調控 <MathInline math="y = a\sin(b(x-h))+k" /> 之振幅、週期、值域與中線</span>, tab: 'periodic-transform', bg: 'from-[#FAF5ED] to-[#F4EADB]', border: 'border-[#E8DAC5]' },
                { icon: 'fa-earth-asia', unit: 'U2', label: '建構生活週期性數學模型', descNode: <span>摩天輪車廂高度、海港潮汐水深變化與月相盈虧週期建模</span>, tab: 'periodic-models', bg: 'from-[#FAF2F1] to-[#F4E4E3]', border: 'border-[#EACECB]' },
                { icon: 'fa-clipboard-check', unit: 'All', label: '觀念澄清與素養題庫全攻略', descNode: <span>破除常見平移陷阱與概念迷思，挑戰大考經典素養題</span>, tab: 'periodic-quiz', bg: 'from-[#F5F2F8] to-[#E9E3F1]', border: 'border-[#DAD0E7]' },
              ].map((obj, i) => (
                <button key={i} onClick={() => setActiveTab(obj.tab)}
                  className={`group text-left p-5 rounded-2xl border ${obj.border} bg-gradient-to-br ${obj.bg} hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 shadow-xs`}>
                  <div className="flex items-start gap-4">
                    <div className="w-10 h-10 bg-[#FAF7F2] border border-[#DDD3C2] rounded-xl flex items-center justify-center shrink-0 group-hover:border-[#C59B63] transition-colors shadow-xs">
                      <i className={`fa-solid ${obj.icon} text-slate-700`}></i>
                    </div>
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-[10px] font-black bg-slate-800 text-white px-2 py-0.5 rounded-md uppercase tracking-wider">{obj.unit}</span>
                        <span className="text-[10px] font-black text-slate-500 uppercase tracking-wider">Goal {i + 1}</span>
                      </div>
                      <div className="font-black text-slate-800 text-sm leading-snug mb-1">{obj.label}</div>
                      <div className="text-xs text-slate-600 font-medium leading-relaxed">{obj.descNode}</div>
                    </div>
                  </div>
                </button>
              ))}
            </div>
          </div>

          {/* Teacher's Note */}
          <div className="bg-gradient-to-br from-caramel-light to-[#F3E5D4] border border-caramel-border rounded-2xl p-6 shadow-xs">
            <div className="flex items-start gap-4">
              <div className="w-10 h-10 bg-caramel/20 rounded-xl flex items-center justify-center shrink-0 border border-caramel-border shadow-xs">
                <i className="fa-solid fa-chalkboard-user text-caramel-dark"></i>
              </div>
              <div>
                <div className="font-black text-caramel-dark mb-2 flex items-center gap-2">
                  老師的話
                  <span className="text-[10px] bg-caramel-light text-caramel-dark px-2 py-0.5 rounded-full font-black uppercase border border-caramel-border">Teacher's Note</span>
                </div>
                <p className="text-sm text-slate-700 leading-relaxed font-medium">
                  數學源於生活，更用於解釋大自然的規律。「弧度量」讓我們能以無因次的實數描述轉動；而「週期性數學模型」則將這種圓周運動拓展為時間與空間的波浪起伏。<br /><br />
                  無論是旋轉的摩天輪、規律漲退的潮汐、還是夜空中陰晴圓缺的月亮，正弦函數以其無可挑剔的對稱性，描繪出宇宙最動人的節奏！
                </p>
              </div>
            </div>
          </div>

          <div className="mt-8 text-center text-slate-500 font-bold text-xs flex items-center justify-center gap-2 uppercase tracking-wider">
            <i className="fa-solid fa-code text-[#C59B63]"></i>
            Designed by Valerie Yu / Linkou Kang Chiao Math Teacher
          </div>
        </div>
      );
    };

    // ── MAIN APP ROOT ──
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [globalProgress, setGlobalProgress] = useState(getStoredScores);
      const [showResetModal, setShowResetModal] = useState(false);
      const [toastMsg, setToastMsg] = useState('');
      const [unitFilter, setUnitFilter] = useState('all'); // 'all', 'u1', 'u2'

      useEffect(() => {
        const handleStorage = () => setGlobalProgress(getStoredScores());
        window.addEventListener('storage', handleStorage);
        window.addEventListener('score_updated', handleStorage);
        return () => {
          window.removeEventListener('storage', handleStorage);
          window.removeEventListener('score_updated', handleStorage);
        };
      }, []);

      const updateGlobalScore = (category, key, value) => {
        setGlobalProgress(prev => {
          const next = { ...prev };
          if (key !== undefined && key !== null) {
            if (value === undefined) {
              const catCopy = { ...(next[category] || {}) };
              delete catCopy[key];
              next[category] = catCopy;
            } else {
              next[category] = { ...(next[category] || {}), [key]: value };
            }
          } else {
            next[category] = value;
          }
          localStorage.setItem('radian_lab_scores', JSON.stringify(next));
          return next;
        });
      };

      const handleConfirmReset = () => {
        try {
          localStorage.removeItem('radian_lab_scores');
        } catch (e) {
          console.error(e);
        }
        const freshScores = {
          misconception: {}, misconceptionChoices: {}, practice: {}, practiceChoices: {},
          misconception_u2: {}, misconception_u2_choices: {}, practice_u2: {}, practice_u2_choices: {}
        };
        setGlobalProgress(freshScores);
        window.dispatchEvent(new Event('score_updated'));
        setShowResetModal(false);
        setToastMsg('✓ 雙單元學習進度已成功重設為 0 分！');
        setTimeout(() => setToastMsg(''), 3000);
      };

      // Score Calculation:
      // Unit 1: 7 Misconception (10 pts = 70) + 3 Practice (10 pts = 30) = 100 pts
      // Unit 2: 7 Misconception (10 pts = 70) + 4 Practice (7.5 pts = 30 or 10 pts = 40) => Total 200 pts
      const calculateTotalScore = (s) => {
        let total = 0;
        // Unit 1
        total += Object.values(s?.misconception || {}).filter(Boolean).length * 10;
        total += Object.values(s?.practice || {}).filter(Boolean).length * 10;
        // Unit 2
        total += Object.values(s?.misconception_u2 || {}).filter(Boolean).length * 10;
        total += Object.values(s?.practice_u2 || {}).filter(Boolean).length * 7.5;
        return Math.min(200, Math.max(0, Math.round(total)));
      };

      const totalScore = calculateTotalScore(globalProgress);

      const navItems = [
        { id: 'home', unit: 'all', title: '首頁總覽', icon: 'fa-house', color: 'text-slate-600' },
        
        { sectionHeader: '單元 01 · 弧度量', unit: 'u1' },
        { id: 'definition', unit: 'u1', title: '弧度定義與物理展開', icon: 'fa-circle-notch', color: 'text-nordic' },
        { id: 'quadrant', unit: 'u1', title: '角度換算與象限角', icon: 'fa-arrows-spin', color: 'text-lavender' },
        { id: 'sector', unit: 'u1', title: '扇形弧長與面積實驗室', icon: 'fa-pie-chart', color: 'text-sage' },
        { id: 'application', unit: 'u1', title: '哥德式尖拱與地球測量', icon: 'fa-landmark', color: 'text-caramel' },
        { id: 'trig', unit: 'u1', title: '弧度三角比與計算機', icon: 'fa-calculator', color: 'text-terracotta' },
        { id: 'quiz', unit: 'u1', title: '單元01 觀念是非題', icon: 'fa-clipboard-check', color: 'text-sage' },
        { id: 'practice', unit: 'u1', title: '單元01 隨堂引導題', icon: 'fa-graduation-cap', color: 'text-lavender' },

        { sectionHeader: '單元 02 · 週期性數學模型', unit: 'u2' },
        { id: 'periodic-sine', unit: 'u2', title: '單位圓與正弦波生成', icon: 'fa-circle-nodes', color: 'text-nordic' },
        { id: 'periodic-transform', unit: 'u2', title: '正弦圖形變換實驗室', icon: 'fa-arrows-up-down-left-right', color: 'text-lavender' },
        { id: 'periodic-models', unit: 'u2', title: '生活週期性現象模擬', icon: 'fa-earth-asia', color: 'text-caramel' },
        { id: 'periodic-quiz', unit: 'u2', title: '單元02 觀念是非題', icon: 'fa-clipboard-check', color: 'text-sage' },
        { id: 'periodic-practice', unit: 'u2', title: '單元02 經典素養題', icon: 'fa-graduation-cap', color: 'text-lavender' },
      ];

      const visibleNav = navItems.filter(item => {
        if (unitFilter === 'all') return true;
        if (item.unit === 'all') return true;
        return item.unit === unitFilter;
      });

      return (
        <div className="min-h-screen flex flex-col md:flex-row gap-4 p-4 md:p-8 max-w-[1440px] mx-auto relative">
          {/* Background Decorative Blobs */}
          <div className="bg-decorations">
            <div className="blob-1"></div>
            <div className="blob-2"></div>
            <div className="blob-3"></div>
          </div>

          {/* Left Sidebar (320px) */}
          <div className="w-full md:w-[320px] space-y-4 shrink-0 relative z-10">
            {/* Header Brand Card */}
            <div className="textbook-card p-6 md:p-8 rounded-2xl cursor-pointer transition-all hover:shadow-md border border-[#DDD3C2]" onClick={() => setActiveTab('home')}>
              <div className="text-[10px] font-black bg-[#EAE3D5] text-slate-800 border border-[#DDD3C2] px-3 py-1 rounded-full inline-block mb-3 uppercase tracking-widest shadow-xs">
                10B MATH · UNITS 01 & 02
              </div>
              <h1 className="text-2xl md:text-3xl font-bold font-chenyu leading-tight text-slate-800">
                弧度量與週期模型<br />
                <span className="text-base font-serif text-[#C59B63] font-normal">Radian & Periodic Lab</span>
              </h1>
              <p className="text-[11px] font-bold mt-3 flex items-center gap-1.5 text-slate-500">
                <i className="fa-solid fa-house text-slate-600"></i> 點擊返回首頁總覽
              </p>
            </div>

            {/* Unit Filter Selector Pills */}
            <div className="bg-[#FAF7F2] p-1.5 rounded-2xl border border-[#DDD3C2] flex gap-1 shadow-xs">
              {[
                { id: 'all', label: '全部單元' },
                { id: 'u1', label: '單元 01' },
                { id: 'u2', label: '單元 02' },
              ].map(f => (
                <button key={f.id} onClick={() => setUnitFilter(f.id)}
                  className={`flex-1 py-1.5 text-xs font-black rounded-xl transition-all ${
                    unitFilter === f.id ? 'bg-[#2B3848] text-white shadow-xs' : 'text-slate-600 hover:bg-[#EFE8DC]'
                  }`}>
                  {f.label}
                </button>
              ))}
            </div>

            {/* Navigation Menu */}
            <div className="bg-[#FAF7F2]/90 backdrop-blur-md rounded-2xl shadow-xs border border-[#DDD3C2] p-3 space-y-1 max-h-[520px] overflow-y-auto no-scrollbar">
              {visibleNav.map((tab, idx) => {
                if (tab.sectionHeader) {
                  return (
                    <div key={`header-${idx}`} className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-3 pt-3 pb-1">
                      {tab.sectionHeader}
                    </div>
                  );
                }

                const isActive = activeTab === tab.id;
                return (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center justify-between p-3 rounded-xl transition-all duration-200 font-black border ${
                      isActive
                        ? 'bg-[#2B3848] text-white border-[#2B3848] shadow-md transform scale-[1.01]'
                        : 'border-transparent text-slate-700 hover:bg-[#EAE3D5]/70 hover:text-slate-900'
                    }`}>
                    <div className="flex items-center gap-3">
                      <i className={`fa-solid ${tab.icon} ${isActive ? 'text-white' : tab.color}`}></i>
                      <span className="text-xs">{tab.title}</span>
                    </div>
                    <i className="fa-solid fa-chevron-right text-[10px] opacity-40"></i>
                  </button>
                );
              })}
            </div>

            {/* Score Card in Sidebar */}
            <div className="textbook-card p-5 rounded-2xl border border-[#DDD3C2]">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-black text-slate-500 uppercase tracking-widest">全單元學習成就</span>
                <div className="flex items-center gap-2">
                  <span className="text-sm font-black text-slate-800">{totalScore} / 200</span>
                  <button onClick={() => setShowResetModal(true)} title="重置進度為 0 分"
                    className="text-[11px] text-slate-500 hover:text-rose-600 font-bold transition-colors">
                    <i className="fa-solid fa-rotate-left mr-0.5"></i>重置
                  </button>
                </div>
              </div>
              <div className="w-full bg-[#EAE3D5] rounded-full h-2.5 overflow-hidden">
                <div className="progress-bar transition-all duration-500" style={{ width: `${(totalScore / 200) * 100}%` }}></div>
              </div>
            </div>
          </div>

          {/* Right Main Content Pane */}
          <div className="flex-1 w-full max-w-4xl no-scrollbar overflow-y-auto relative z-10">
            {activeTab === 'home' && <HomeTab setActiveTab={setActiveTab} totalScore={totalScore} onOpenResetModal={() => setShowResetModal(true)} unitFilter={unitFilter} setUnitFilter={setUnitFilter} />}
            {/* Unit 01 Tabs */}
            {activeTab === 'definition' && <DefinitionTab />}
            {activeTab === 'quadrant' && <QuadrantTab />}
            {activeTab === 'sector' && <SectorTab />}
            {activeTab === 'application' && <ApplicationTab />}
            {activeTab === 'trig' && <TrigTab />}
            {activeTab === 'quiz' && <MisconceptionTab globalProgress={globalProgress} updateGlobalScore={updateGlobalScore} />}
            {activeTab === 'practice' && <PracticeTab globalProgress={globalProgress} updateGlobalScore={updateGlobalScore} />}
            {/* Unit 02 Tabs */}
            {activeTab === 'periodic-sine' && <PeriodicSineTab />}
            {activeTab === 'periodic-transform' && <PeriodicTransformTab />}
            {activeTab === 'periodic-models' && <PeriodicModelsTab />}
            {activeTab === 'periodic-quiz' && <PeriodicQuizTab globalProgress={globalProgress} updateGlobalScore={updateGlobalScore} />}
            {activeTab === 'periodic-practice' && <PeriodicPracticeTab globalProgress={globalProgress} updateGlobalScore={updateGlobalScore} />}
          </div>

          {/* Reset Modal */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in"
              onClick={() => setShowResetModal(false)}>
              <div className="bg-[#FAF7F2] rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl border border-[#DDD3C2] animate-scale-up text-left"
                onClick={e => e.stopPropagation()}>
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-xl shrink-0">
                    <i className="fa-solid fa-triangle-exclamation"></i>
                  </div>
                  <div>
                    <h3 className="text-xl font-black text-slate-800">確定要重置所有進度嗎？</h3>
                    <p className="text-xs text-slate-400 font-bold tracking-wider">RESET ALL UNITS PROGRESS</p>
                  </div>
                </div>
                <p className="text-sm font-bold text-slate-600 leading-relaxed mb-6">
                  此操作將清除單元 01 與單元 02 的所有是非題與隨堂練習作答紀錄，並將您的學習成就進度重設為 <strong className="text-rose-600 font-black">0 分</strong>。
                </p>
                <div className="flex gap-3 justify-end">
                  <button onClick={() => setShowResetModal(false)}
                    className="px-5 py-2.5 rounded-xl font-black text-xs text-slate-700 bg-[#EAE3D5] hover:bg-[#DDD3C2] transition-all">
                    取消
                  </button>
                  <button onClick={handleConfirmReset}
                    className="px-5 py-2.5 rounded-xl font-black text-xs text-white bg-rose-600 hover:bg-rose-500 shadow-md shadow-rose-500/30 transition-all flex items-center gap-2">
                    <i className="fa-solid fa-rotate-left"></i> 確認重置為 0 分
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#2B3848]/95 text-white font-black text-sm px-5 py-3 rounded-2xl shadow-xl border border-slate-700/50 backdrop-blur-md animate-slide-up flex items-center gap-3">
              <span className="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs">✓</span>
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
